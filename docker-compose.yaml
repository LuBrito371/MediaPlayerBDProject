services:
  db:
    image: postgres:15-alpine
    container_name: projeto-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-admin}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-adminpassword}
      POSTGRES_DB: ${POSTGRES_DB:-musical}
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - ./db/schema/init.sql:/docker-entrypoint-initdb.d/01-init.sql:ro
      - ./db/views/views_relatorios.sql:/docker-entrypoint-initdb.d/02-views.sql:ro
      - ./db/seed/seed_realistic.sql:/docker-entrypoint-initdb.d/03-seed.sql:ro
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-admin} -d ${POSTGRES_DB:-musical}"]
      interval: 5s
      timeout: 5s
      retries: 10

  backend:
    build: ./back-end
    container_name: projeto-backend
    restart: unless-stopped
    ports:
      - "${BACKEND_PORT:-8080}:8080"
    depends_on:
      db:
        condition: service_healthy
    environment:
      SPRING_DATASOURCE_URL: jdbc:postgresql://db:5432/${POSTGRES_DB:-musical}
      SPRING_DATASOURCE_USERNAME: ${POSTGRES_USER:-admin}
      SPRING_DATASOURCE_PASSWORD: ${POSTGRES_PASSWORD:-adminpassword}
      SPRING_JPA_DDL_AUTO: ${SPRING_JPA_DDL_AUTO:-update}
      SPRING_JPA_SHOW_SQL: ${SPRING_JPA_SHOW_SQL:-false}
      CORS_ALLOWED_ORIGINS: ${CORS_ALLOWED_ORIGINS:-http://localhost:5173,http://127.0.0.1:5173}

  frontend:
    build:
      context: ./front-end
      args:
        VITE_API_URL: ${VITE_API_URL:-http://localhost:8080}
    container_name: projeto-frontend
    restart: unless-stopped
    ports:
      - "${FRONTEND_PORT:-5173}:80"
    depends_on:
      - backend

volumes:
  postgres_data:
